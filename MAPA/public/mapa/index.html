<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrienteSV - Mapa Interactivo de la Zona Oriental de El Salvador</title>
    <!-- Meta descripción para SEO -->
    <meta name="description" content="Explora de manera interactiva la geografía, demografía y atractivos turísticos de la zona oriental de El Salvador (Usulután, San Miguel, Morazán, La Unión) con Leaflet y GeoJSON.">
    
    <!-- Google Fonts: Outfit e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    
    <!-- Lucide Icons para iconografía moderna -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botón de Regresar (Atrás) -->
    <button id="btn-back-map" class="btn btn-secondary btn-sm btn-back-map" style="display: none; position: absolute; top: 15px; left: 15px; z-index: 1000; border-radius: 30px; gap: 0.25rem;">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Regresar</span>
    </button>

    <!-- El elemento del mapa Leaflet -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    
    <!-- Datos GeoJSON locales -->
    <script src="oriente_geojson.js"></script>
    
    <!-- Lógica de la Aplicación -->
    <script src="app.js"></script>
</body>
</html>
